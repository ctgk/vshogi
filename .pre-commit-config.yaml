# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: true
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: 'assets'
    -   id: end-of-file-fixer
        exclude: 'assets'
    -   id: check-yaml
    -   id: check-ast
    -   id: check-added-large-files
    -   id: mixed-line-ending
        args: ['--fix', 'lf']
    -   id: no-commit-to-branch
        args: ['--branch', 'main']
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 'v19.1.7'  # Use the sha / tag you want to point at
    hooks:
    -   id: clang-format
        files: '\.(c|h|cpp|hpp)$'
-   repo: local
    hooks:
    -   id: cpp-unittest
        name: Run C++ UnitTests
        entry: bash -c 'cd `git rev-parse --show-toplevel`; rm -rf build/pre-commit; mkdir -p build/pre-commit; cd build/pre-commit; cmake ../../cpp -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON && make && ./tests/test_vshogi' --
        types: [text]
        files: '\.(c|h|cpp|hpp)$'
        exclude: 'cpp/python/'
        pass_filenames: false
        language: system
    -   id: flake8
        name: Check Python format
        entry: flake8 --count --show-source --statistics
        language: system
        types: [python]
    -   id: python-setup
        name: Build Python extensions
        language: system
        entry: pip install -e .[develop]
        types: [text]
        files: '\.(c|h|cpp|hpp)$'
        pass_filenames: false
    -   id: python-unittest
        name: Run Python UnitTests
        language: system
        entry: bash -c "pytest --doctest-modules --ignore-glob='**/dlshogi/*' python/"
        types: [text]
        files: '\.(c|h|cpp|hpp|py)$'
        pass_filenames: false
    -   id: python-readme
        name: Run README examples
        entry: python -m doctest README.md
        language: system
        files: '(\.(c|h|cpp|hpp|py)$|README.md)'
        pass_filenames: false
    -   id: python-profile
        name: Run Python profiling script
        language: system
        entry: python examples/dlshogi_model.py --short
        types: [text]
        files: '\.(c|h|cpp|hpp|py)$'
        pass_filenames: false
