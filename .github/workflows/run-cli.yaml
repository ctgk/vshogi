name: Run CLI Training

on:
  push:
    branches: [ main, develop, tmp ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [
          {algorithm: "alpha-zero", num_games: 50, epochs: 5},
          {algorithm: "gumbel-alpha-zero", num_games: 50, epochs: 5},
          {algorithm: "klent", num_games: 2500, epochs: 1},
        ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: 3.12
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install dependencies
      run: pip install .[dlshogi]
    - name: Run command
      env:
        ALGORITHM: ${{ matrix.config.algorithm }}
        NUM_GAMES: ${{ matrix.config.num_games }}
        EPOCHS: ${{ matrix.config.epochs }}
      run: |
        python -m vshogi $ALGORITHM cycler minishogi \
        --cycles 3 --play-num-games $NUM_GAMES \
        --train-network-blocks 3 --train-validation-threshold 0.01 \
        --train-optimization-epochs $EPOCHS
    - name: Evaluate model
      run: |
        python -m vshogi match minishogi \
        --player1 models/model_0000.tflite \
        --player2 models/model_0003.tflite \
        --az-search-count 100
    - name: Check generated dataset
      run: |
        for tsv in datasets/dataset_0003/kifu_00*.tsv; do
          echo "$tsv"
          cat "$tsv"
          python .github/workflows/check_selfplay_dataset.py "$tsv"
        done
