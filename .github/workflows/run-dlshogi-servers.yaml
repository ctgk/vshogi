name: Run DL-Shogi Training Servers

on:
  push:
    branches: [ main, develop, tmp ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: 3.12
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install dependencies
      run: pip install .[dlshogi]
    - name: Run command
      run: |
        python python/scripts/run_dlshogi_servers.py minishogi \
        --duration-seconds 600 --train-epochs 1
    - name: Check generated datasets and models
      run: |
        ls models/ datasets/
