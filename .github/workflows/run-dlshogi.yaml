name: Run DL-Shogi Training

on:
  push:
    branches: [ main, develop, tmp ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game: [
          {name: minishogi, rl_cycle: 8, nn_backbone_blocks: 3},
          {name: judkins_shogi, rl_cycle: 6, nn_backbone_blocks: 3},
          {name: shogi, rl_cycle: 2, nn_backbone_blocks: 2},
        ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: 3.12
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install dependencies
      run: pip install .[dlshogi]
    - name: Run command
      env:
        NAME: ${{ matrix.game.name }}
        CYCLE: ${{ matrix.game.rl_cycle }}
        BACKBONES: ${{ matrix.game.nn_backbone_blocks }}
      run: python examples/dlshogi.py rl $NAME --rl_cycle $CYCLE --nn_backbone_blocks $BACKBONES --mcts_search 100 --self_play 50 --nn_epochs 5 --win_ratio_threshold 0.1
    - name: Evaluate model
      env:
        NAME: ${{ matrix.game.name }}
        CYCLE: ${{ matrix.game.rl_cycle }}
      run: python -m vshogi $NAME --player1 $NAME/models/model_0000.tflite --player2 $NAME/models/model_$(printf %04d $CYCLE).tflite --mcts_search_count 100
