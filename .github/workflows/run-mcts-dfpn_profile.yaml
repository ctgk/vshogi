name: Run MCTS-DFPN profiling

on:
  push:
    branches: [ main, develop, tmp ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: install packages
      run: sudo apt update -y; sudo apt install -y build-essential make cpputest libc++-dev python3 graphviz; pip install gprof2dot
    - name: Build
      run: cmake -DCMAKE_CXX_FLAGS=-pg -DCMAKE_EXE_LINKER_FLAGS=-pg -DCMAKE_SHARED_LINKER_FLAGS=-pg ./cpp; make
    - name: Execute
      run: ./tests/test_vshogi -r20 -g shogi_engine -n mcts_with_dfpn
    - name: Profile
      run: gprof ./tests/test_vshogi gmon.out > profile.txt; cat profile.txt
    - name: Convert to image
      run: cat profile.txt | gprof2dot -s | dot -Tpng -o output.png
    - name: Upload image
      uses: actions/upload-artifact@v4
      with:
        name: generated-image
        path: output.png
